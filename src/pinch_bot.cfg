[Locations]
# Path to the loadout/appearance config (relative to THIS file).
looks_config = ./appearance.cfg
# Path to the bot's python file (relative to THIS file). RLBot inserts this
# file's directory onto sys.path and imports it, so sibling modules under src/
# can be imported normally in later stages.
python_file = ./bot.py
# Requirements RLBotGUI should install for this bot.
requirements_file = ../requirements.txt
# Name displayed in game.
name = PinchBot
# Maximum ticks per second this bot wants to receive.
maximum_tick_rate_preference = 120

[Details]
developer = rapidz
description = Kuxir-style wall-pinch bot. Stage 0: proven RLBot foundation.
fun_fact =
github = https://github.com/rapidzYT/PinchBot
language = python

# Top-level match config. Used by the command-line runner (python run.py) and
# as documentation. When using RLBotGUI you normally just add src/pinch_bot.cfg
# directly and do not need this file. All keys verified against rlbot 1.68.0.

[Match Configuration]
num_participants = 1
game_mode = Soccer
game_map = DFHStadium
# Keep rendering on so Stage 2+ debug overlays are visible.
enable_rendering = True
# Needed later for setting up repeatable test scenarios (set_game_state).
enable_state_setting = True

[Participant Configuration]
# One RLBot-controlled PinchBot on the blue team (team 0).
participant_config_0 = ./src/pinch_bot.cfg
participant_team_0 = 0
participant_type_0 = rlbot
participant_bot_skill_0 = 1.0
participant_loadout_config_0 = None

[Mutator Configuration]
# Defaults (standard match). Left explicit for clarity; omitting is also fine.
Match Length = 5 Minutes
Max Score = Unlimited
Overtime = Unlimited
Game Speed = Default
Ball Max Speed = Default
Ball Type = Default
Ball Weight = Default
Ball Size = Default
Ball Bounciness = Default
Boost Amount = Default
Rumble = None
Boost Strength = 1x
Gravity = Default
Demolish = Default
Respawn Time = 3 Seconds
